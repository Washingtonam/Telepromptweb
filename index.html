<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0f">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Teleprompter</span>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="cameraBtn" type="button" title="Camera recording" aria-label="Open camera recording">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button class="icon-button" id="fullscreenBtn" type="button" title="Fullscreen (F)" aria-label="Enter fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
      </div>
    </header>

    <section class="workspace">
      <aside class="editor-panel" id="editorPanel" aria-label="Script editor">
        <div class="panel-heading">
          <label for="scriptEditor">Script</label>
          <span id="saveStatus" class="save-status" role="status">Saved</span>
        </div>
        <textarea id="scriptEditor" spellcheck="true" aria-label="Teleprompter script">Welcome to the teleprompter.

Paste or type your script here. Use the controls below to start reading, adjust the speed, or change the text size.

This teleprompter supports keyboard shortcuts:
Space to start or pause
Up and Down arrows to adjust your position
R to reset
F to enter fullscreen

Take a breath, look toward your audience, and begin.</textarea>
      </aside>

      <section class="prompter-shell" aria-label="Teleprompter display">
        <div class="prompter-viewport" id="prompterViewport">
          <div class="reading-progress" aria-hidden="true">
            <span id="readingProgressValue">0%</span>
            <span class="reading-progress-track"><span id="readingProgressFill"></span></span>
          </div>
          <div class="guide guide-left" aria-hidden="true"></div>
          <div class="guide guide-right" aria-hidden="true"></div>
          <div class="reading-text" id="readingText" aria-live="off"></div>
        </div>
      </section>
    </section>

    <footer class="control-dock" aria-label="Teleprompter controls">
      <div class="transport">
        <button class="transport-button" id="resetBtn" type="button" title="Reset (R)" aria-label="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 15a7 7 0 1 0 2-7.7L4 10"/></svg>
        </button>
        <button class="play-button" id="playBtn" type="button" title="Play or pause (Space)" aria-label="Start teleprompter">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
      </div>

      <div class="control-group speed-control">
        <div class="control-label"><label for="speedSlider">Speed</label><output id="speedValue" for="speedSlider">1.0×</output></div>
        <input id="speedSlider" type="range" min="0.25" max="3" step="0.25" value="1" aria-label="Scrolling speed">
      </div>

      <div class="control-group font-control">
        <div class="control-label"><label for="fontSlider">Font size</label><output id="fontValue" for="fontSlider">64 px</output></div>
        <input id="fontSlider" type="range" min="24" max="120" step="1" value="64" aria-label="Font size">
      </div>

      <div class="mirror-controls" role="group" aria-label="Mirror controls">
        <span>Mirror</span>
        <button id="mirrorHBtn" class="toggle-button" type="button" aria-pressed="false" title="Mirror horizontally">H</button>
        <button id="mirrorVBtn" class="toggle-button" type="button" aria-pressed="false" title="Mirror vertically">V</button>
      </div>

      <div class="status-group">
        <div class="timer" title="Reading time">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
          <span id="timerValue">00:00</span>
        </div>
        <div class="progress-box">
          <span id="progressValue">0%</span>
          <div class="progress-track" role="progressbar" aria-label="Script progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
    </footer>
  </main>
  <aside class="camera-panel" id="cameraPanel" aria-label="Camera recording" hidden>
    <div class="camera-heading">
      <div>
        <strong>Camera</strong>
        <span id="cameraStatus" role="status">Camera is off</span>
      </div>
      <button class="camera-close" id="cameraCloseBtn" type="button" aria-label="Close camera panel">&times;</button>
    </div>
    <video id="cameraPreview" autoplay muted playsinline></video>
    <button class="camera-resize-handle" id="cameraResizeHandle" type="button" aria-label="Resize camera preview" title="Drag or use arrow keys to resize">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20 20 8M14 20l6-6M20 14v6h-6"/></svg>
    </button>
    <div class="camera-toolbar">
      <select id="cameraSelect" aria-label="Camera device">
        <option value="">Default camera</option>
      </select>
      <select id="formatSelect" aria-label="Recording format" title="MP4 is preferred; MOV uses MP4-compatible recording when available">
        <option value="mp4" selected>MP4</option>
        <option value="webm">WebM</option>
        <option value="mov">MOV*</option>
      </select>
      <button id="switchCameraBtn" class="camera-secondary" type="button">Switch</button>
      <button id="libraryBtn" class="camera-secondary" type="button">Library</button>
      <button id="recordBtn" class="record-button" type="button" disabled>
        <span class="record-dot"></span>
        <span id="recordButtonText">Record</span>
      </button>
    </div>
    <div class="recordings-heading">
      <strong>Saved recordings</strong>
      <span id="recordingCount">0</span>
    </div>
    <div class="recordings-list" id="recordingsList"></div>
  </aside>
  <script src="script.js"></script>
</body>
</html>
